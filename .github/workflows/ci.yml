name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint, format, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet --disable-pip-version-check \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test:run

      - name: Production build
        run: npm run build

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Basic secret scan
        run: |
          if grep -rInE \
              "(api[_-]?key|secret|password|token|bearer)[\"']?\s*[:=]\s*[\"'][A-Za-z0-9_\-]{16,}" \
              --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" \
              --include="*.json" --include="*.yml" --include="*.yaml" \
              --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.venv .; then
            echo "Potential hardcoded secret found — review the matches above."
            exit 1
          fi
          echo "No obvious secrets found."